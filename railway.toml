# Railway build config. Railway auto-detects this file at the repo root.
# We use the existing Dockerfile and let Railway build + deploy it.
# The same image is used for two services (api + worker); the start command
# is overridden per-service in the Railway UI (see DEPLOY_RAILWAY.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
# Per-service startCommand is set in the Railway dashboard/API so api and
# worker can differ while sharing this single image.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
