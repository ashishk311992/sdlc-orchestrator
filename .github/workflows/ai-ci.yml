name: AI CI (self-healing)

# This workflow lives in the target application repo (the one the platform ships PRs to).
# It runs on every push to an `ai/*` branch and on pull_request events for those branches.
# On completion it POSTs the conclusion + truncated logs back to the platform, which
# decides whether to trigger the Healer Agent.

on:
  push:
    branches:
      - 'ai/**'
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Platform run id'
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.id.outputs.run_id }}
      test_command: ${{ steps.id.outputs.test_command }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: id
        name: Resolve platform run id and test command
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RUN_ID="${BRANCH##*-}"
          if [[ -n "${{ github.event.inputs.run_id }}" ]]; then
            RUN_ID="${{ github.event.inputs.run_id }}"
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          if [[ -f package.json ]]; then
            CMD="npm test --silent"
          elif [[ -f pyproject.toml || -f requirements.txt || -f setup.py ]]; then
            CMD="pytest -q"
          elif [[ -f go.mod ]]; then
            CMD="go test ./..."
          elif [[ -f pom.xml ]]; then
            CMD="mvn -B test"
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            CMD="./gradlew test"
          else
            CMD="echo 'no test runner detected' && exit 1"
          fi
          echo "test_command=${CMD}" >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Java
        if: ${{ hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install JS deps
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Python deps
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: pip install -r requirements.txt

      - name: Install Python project
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: pip install -e .[dev] || pip install -e . || true

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          CMD: ${{ needs.detect.outputs.test_command }}
        run: |
          set -o pipefail
          mkdir -p .ai-ci
          bash -c "$CMD" 2>&1 | tee .ai-ci/test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ci-logs-${{ needs.detect.outputs.run_id }}
          path: .ai-ci/
          retention-days: 7

      - name: Report result to platform
        if: always()
        shell: bash
        env:
          PLATFORM_URL: ${{ secrets.AI_PLATFORM_URL }}
          PLATFORM_TOKEN: ${{ secrets.AI_PLATFORM_TOKEN }}
          RUN_ID: ${{ needs.detect.outputs.run_id }}
          TEST_COMMAND: ${{ needs.detect.outputs.test_command }}
          EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORM_URL:-}" || -z "${PLATFORM_TOKEN:-}" ]]; then
            echo "platform secrets not set; skipping callback"
            exit 0
          fi

          if [[ "${EXIT_CODE}" == "0" ]]; then
            export CONCLUSION="success"
          else
            export CONCLUSION="failure"
          fi

          LOGS_RAW="$(tail -c 30000 .ai-ci/test.log 2>/dev/null || echo '')"
          export LOGS="${LOGS_RAW}"

          python3 - <<'PY'
          import json, os, sys, urllib.request
          payload = {
              "run_id": os.environ["RUN_ID"],
              "conclusion": os.environ["CONCLUSION"],
              "workflow_run_id": int(os.environ.get("WORKFLOW_RUN_ID", "0") or 0),
              "test_command": os.environ.get("TEST_COMMAND", ""),
              "logs": os.environ.get("LOGS", ""),
          }
          req = urllib.request.Request(
              os.environ["PLATFORM_URL"].rstrip("/") + "/webhooks/github/ci-report",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["PLATFORM_TOKEN"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("platform response:", resp.status, resp.read().decode()[:500])
          except Exception as exc:
              print("platform callback failed:", exc, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Fail job if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "Tests failed (exit ${{ steps.tests.outputs.exit_code }}). Platform was notified for self-heal."
          exit 1
